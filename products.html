<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset= "UTF -8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Dreions products</title>
    <link rel="stylesheet" href="Style.css"></link>


<body>
    <div class="loader-wrapper">

    <div class="spinner"></div>
    <p>Loading products please wait a moment untill you have been redirected to product page </p>
    <header class="navbar">
        <div class="logo">
            <span class="logo icon"></span>
         </div>
         <nav>
            <ul class="nav-links">
                <li><a href ="#hero" class="nav-item">Home</a></li>
                <li><a href ="#hero" class="nav-item">Contacts</a></li>
                <li><a href ="#hero" class="nav-item">Deals</a></li>
                <li><a href ="#hero" class="nav-item">Products</a></li>
            </ul>
         </nav>

    </header>
    <section id="hero" class="hero">
        <div class="hero-decor"></div>
        <div class="hero content">
            <h1></h1>
            <p></p>
            <a href ="#products" class="cta-btn">Explore Collection</a>
        </div>
    </section>
    <section id="products" class="products-section">
        <h2 class="Section-Title">Featured products</h2>
        <div class="product grid">
            <article class="product card" style="--delay: 0.1s">
                <div class="card-badge">New</div>
                <div class="card-image">
                  
                </div>
            </article>


        </div>
    </section>
</body>
</head>
</html>
